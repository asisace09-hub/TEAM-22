<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Barangay Resident Information System</title>
        <link rel="stylesheet" href="login.css">
        <script src="login.js" defer></script>
    </head>
    <body>
        <div class="loginContainer">
            <h1>Barangay Login</h1>
            <p>Resident Information System</p>
            <br>
            <div class="loginFields">
                <form id="loginForm">
                    <p><b>Username:</b></p>
                    <input type="text" id="username" placeholder="Enter username"></input><br><br>
                    <p><b>Password:</b></p>
                    <input type="password" id="password" placeholder="Enter password"></input><br>
                    <p id="loginMessage" role="status" aria-live="polite"> </p><br>
                    <button id="login" type="submit">Log In</button>
                </form>
            </div>
        </div>


        

    </body>
</html>
